# Hypr Sidebar - larger row/col integration test

[layout]
draw_margin_fraction = 0.04

[[page.main.item]]
type = "row"
modules = ["current-workspace"]
height_percent = 3

[[page.main.item]]
type = "row"
modules = ["workspace-tiles"]
height = "content"


[[page.main.item]]
type = "row"
modules = [
    { module = "box", child = { module = "textbox", text = "PW Manager\n Placeholder" } },
]
height_percent = 30

[[page.main.item]]
type = "row"
modules = [
    { module = "box", child = { module = "textbox", text = "Clipboard\n Placeholder" } },
]
height="remaining"

[[page.main.item]]
type = "row"
modules = [
    { module = "box", border = 0, click = "app:audio", child = { module = "textbox", text = "" } },
    { module = "box", border = 0, click = "app:audio", child = { module = "textbox", text = "/" } },
    { module = "box", border = 0, click = "app:audio", child = { module = "textbox", text = "" } },
]
item_widths_percent = [20, 60, 20]
height_percent = 4

[[page.main.item]]
type = "row"
modules = [
    { module = "box", border = 0, click = "app:file_manager", child = { module = "textbox", text = "" } },
    { module = "box", border = 0, click = "app:bluetooth", child = { module = "textbox", text = "" } },
    { module = "box", border = 0, click = "app:network_manager", child = { module = "textbox", text = "" } },	
    { module = "box", border = 0, click = "app:network_manager", child = { module = "textbox", text = "" } },
]
height_percent = 4

[[page.main.item]]
type = "row"
modules = [
    { module = "box", child = { module = "textbox", text = "Beer Clock\n Placeholder" } },
]
height_percent = 10
