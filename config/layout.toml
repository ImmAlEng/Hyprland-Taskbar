# Hypr Sidebar - larger row/col integration test

[layout]
draw_margin_fraction = 0.04
pad_y = 13

# 1. Simple horizontal row with an intentional empty center.
[[page.main.item]]
type = "row"
modules = [
    { module = "textbox", text = "left", alignment = "left", overwrite_pad_x = 8 },
    { module = "empty", overwrite_pad_x = 8 },
    { module = "textbox", text = "right", alignment = "right" },
]
item_widths_percent = [30, 40, 30]
height = 34

# 2. Real top-level vertical col with explicit vertical gap overrides.
[[page.main.item]]
type = "col"
modules = [
    { module = "color-block:red", overwrite_pad_y = 4 },
    { module = "color-block:blue", overwrite_pad_y = 10 },
    { module = "color-block:green", overwrite_pad_y = 2 },
    "color-block:yellow",
]
item_heights_percent = [10, 20, 30, 40]
height = 140
overwrite_pad_y = 20

# 3. Row containing a normal module, a nested col, and another module.
[[page.main.item]]
type = "row"
modules = [
    { module = "color-block:red", overwrite_pad_x = 6 },
    { col = [{ module = "textbox", text = "nested top", overwrite_pad_y = 6 }, { module = "textbox", text = "nested bottom" }], item_heights_percent = [50, 50], overwrite_pad_x = 12 },
    { module = "color-block:blue" },
]
item_widths_percent = [15, 70, 15]
height = 90

# 4. Textbox feature row.
[[page.main.item]]
type = "row"
modules = [
    { module = "textbox", text = "RED", color = "#ff0000", overwrite_pad_x = 8 },
    { module = "textbox", text = "BIG", font_size = 20, overwrite_pad_x = 8 },
    { module = "textbox", text = "small", font_size = 10 },
]
item_widths_percent = [34, 33, 33]
height = 40

# 5. Box wrapper test.
[[page.main.item]]
type = "row"
modules = [
    { module = "box", radius = 8, child = { module = "textbox", text = "box 1" }, overwrite_pad_x = 10 },
    { module = "box", border = 0, child = { module = "textbox", text = "box 0" } },
]
item_widths_percent = [50, 50]
height = 40

# 6. Another top-level col to prove row -> col -> row -> col ordering.
[[page.main.item]]
type = "col"
modules = [
    { module = "textbox", text = "top", alignment = "center", overwrite_pad_y = 5 },
    { module = "empty", overwrite_pad_y = 5 },
    { module = "textbox", text = "bottom", alignment = "center" },
]
item_heights_percent = [30, 40, 30]
height = 120

# 7. Final row. No trailing page pad_y after this item.
[[page.main.item]]
type = "row"
modules = [
    { module = "color-block:green", overwrite_pad_x = 15 },
    { module = "textbox", text = "done" },
]
item_widths_percent = [25, 75]
height = 30
