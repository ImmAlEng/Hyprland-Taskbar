[module]
name = "workspace-tiles"
version = 1
description = "Flexible inactive workspace grid with live application icons."
style = "style.css"

[generator]
entrypoint = "scripts/generate.py"

[dependencies]
commands = ["hyprctl", "python3", "magick"]

[dependencies.arch]
packages = [
    "hyprland",
    "python",
    "python-gobject",
    "gtk3",
    "imagemagick",
]

[dependencies.arch.optional]
packages = ["papirus-icon-theme"]

[platform]
linux_proc = true
