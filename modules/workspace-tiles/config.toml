# Workspace Tiles module configuration

[grid]
# Maximum number of tiles per row.
columns = 2

# 0 means: show every inactive workspace assigned to this monitor slot.
max_visible = 0

# Fraction of the bar's inner width occupied by the complete grid,
# including gaps between columns. 0.92 preserves the current 2-column layout.
grid_width_fraction = 1.0

# Horizontal and vertical gap as a fraction of the bar's inner width.
gap_fraction = 0.02

# Visible tile aspect ratio (width / height).
aspect_ratio = 1.6

border_width = 1
refresh_interval = 1

[theme]
background = "rgba(55, 57, 59, 0.55)"
border = "rgba(100, 103, 105, 0.75)"
hover_background = "rgba(139, 77, 64, 0.45)"
hover_border = "rgba(208, 138, 114, 0.90)"

# Each monitor slot owns an arbitrary list of workspaces.
# One workspace is active, so the remaining workspaces become tiles.

[workspace_slots]
"1" = [1, 3, 5, 7, 9]
"2" = [2, 4, 6, 8, 10]
"3" = [11, 13, 15, 17, 19]
"4" = [12, 14, 16, 18, 20]
